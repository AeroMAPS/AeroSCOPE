[project]
name = "aeroscope"
dynamic = ["version"]
description = "AeroSCOPE: Exploring Aviation Flows"
authors = [
    { name = "Antoine SALGAS", email = "antoine.salgas@isae-supaero.fr" },
    { name = "Junzi SUN", email = "j.sun-1@tudelft.nl" },
    { name = "Scott DELBECQ", email = "scott.delbecq@isae-supaero.fr" },
    { name = "Thomas PLANES", email = "thomas.planes@isae-supaero.fr" },
]
requires-python = ">=3.10, <3.12"
readme = "README.md"
license = "GPL-3.0-only"
keywords = [
    "air transport",
    "flight data",
    "fligh emissions",
]
dependencies = [
    "numpy>=1.23,<3",
    "pandas>=2.1,<3",
    "ipython>=8.8.0,<9",
    "plotly>=5.16.1,<6",
    "ipywidgets>=8.1.1,<9",
    "matplotlib>=3.6.2,<4",
    "ipyvuetify>=1.8.10,<2",
    "jupyterlab>=3.6.1,<4",
    "voila>=0.4.0,<0.5",
    "voila-vuetify==0.6.0",
    "docutils>=0.17.1,<0.18",
]

[project.urls]
Homepage = "https://github.com/AeroMAPS/AeroSCOPE"

[project.scripts]
aeroscope = "aeroscope.app:main"

[dependency-groups]
test = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "coverage[toml]>=7.0,<8",
    "nbval>=0.11,<0.12",
    "wrapt>=1.16.0,<2",
]
doc = [
    "sphinx>=4.1.2,<5",
    "sphinx-rtd-theme>=1.0,<2",
    "sphinxcontrib-bibtex>=2.3.0,<3",
]
lint = [
    "pre-commit>=3.5.0,<4",
    "nbstripout>=0.6.0,<0.7",
    "ruff==0.5.4",
]

[tool.uv]
default-groups = "all"
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

# Packaging system =============================================================
[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aeroscope*"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"