name: watchdog-tests

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 4 * * 1'   # Monday 04:00 UTC

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ '3.14' ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install latest version of dependencies
        run: |
          uv lock --upgrade
          uv sync

      - name: Notebook tests
        run: uv run pytest --no-cov --nbval-lax -p no:python aeroscope
        shell: bash
