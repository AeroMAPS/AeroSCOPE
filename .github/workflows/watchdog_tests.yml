name: watchdog-tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ 'main', 'main-v*' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ 'main', 'main-v*' ]
  schedule:
    - cron: '00 4 * * *'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ '3.11' ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install latest version of dependencies
        run: |
          uv lock --upgrade
          uv sync

      - name: Notebook tests
        run: uv run pytest --no-cov --nbval-lax -p no:python aeroscope
        shell: bash
